[project]
name = "mob-mcp"
version = "0.1.0"
description = "In-repo stdio MCP server for office Mac desktop actuation (MOB)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "MOB contributors" }]
keywords = ["mcp", "macos", "computer-use", "codex", "mob"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Desktop Environment",
]
dependencies = [
  "mcp>=1.28,<2",
  "pillow>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]

[project.scripts]
mob-mcp = "mob_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/xrdavies/mob"
Documentation = "https://github.com/xrdavies/mob/tree/main/services/mob-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/mob_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src/mob_mcp" = "mob_mcp"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
