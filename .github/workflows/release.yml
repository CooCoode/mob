name: Release mob
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test distribution logic
        run: node --test .github/release/*.test.mjs
      - id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          commit="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
  app:
    needs: prepare
    runs-on: macos-15
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Rust target
        run: rustup target add aarch64-apple-darwin
      - name: Install frontend dependencies and test
        run: npm ci && npm test && npm run typecheck
      - name: Import Apple certificate
        id: signing
        uses: ./.github/actions/apple-signing
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Build, sign and notarize App
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY || secrets.TAURI_UPDATER_PUBLIC_KEY }}
          DOWNLOAD_BASE_URL: ${{ vars.DOWNLOAD_BASE_URL || secrets.DOWNLOAD_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "$APPLE_SIGNING_IDENTITY"
          test -n "$APPLE_ID"
          test -n "$APPLE_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_UPDATER_PUBLIC_KEY"
          node .github/release/release.mjs config "$RUNNER_TEMP/tauri-release.json"
          npm run tauri build -- --ci --target aarch64-apple-darwin --bundles app,dmg --config "$RUNNER_TEMP/tauri-release.json" -- --locked
          bundle=src-tauri/target/aarch64-apple-darwin/release/bundle
          codesign --verify --deep --strict --verbose=2 "$bundle/macos/Mob.app"
          xcrun stapler validate "$bundle/macos/Mob.app"
          spctl --assess --type execute --verbose=2 "$bundle/macos/Mob.app"
          mkdir -p release-assets
          cp "$RUNNER_TEMP/tauri-release.json" release-assets/mob_release.json
          cp "$bundle"/dmg/*.dmg "release-assets/mob_${RELEASE_VERSION}_darwin_arm64.dmg"
          cp "$bundle/macos/Mob.app.tar.gz" "release-assets/mob_${RELEASE_VERSION}_darwin_arm64.app.tar.gz"
          cp "$bundle/macos/Mob.app.tar.gz.sig" "release-assets/mob_${RELEASE_VERSION}_darwin_arm64.app.tar.gz.sig"
      - uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: release-assets/*
          if-no-files-found: error
      - name: Remove signing keychain
        if: always() && steps.signing.outputs.keychain != ''
        env:
          SIGNING_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: security delete-keychain "$SIGNING_KEYCHAIN"
  # Windows and Linux only when the repository variables RELEASE_WINDOWS / RELEASE_LINUX are true
  # (publish-r2.yml reads them too); macOS is always released.
  windows:
    needs: prepare
    if: vars.RELEASE_WINDOWS == 'true'
    runs-on: windows-2022
    environment: release
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend dependencies and test
        run: npm ci && npm test
      # Unsigned (no Authenticode yet): SmartScreen warns on first run. The updater payload is
      # still signed with the Tauri key.
      - name: Build installer
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY || secrets.TAURI_UPDATER_PUBLIC_KEY }}
          DOWNLOAD_BASE_URL: ${{ vars.DOWNLOAD_BASE_URL || secrets.DOWNLOAD_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          node .github/release/release.mjs config "$RUNNER_TEMP/tauri-release.json"
          npm run tauri build -- --ci --bundles nsis --config "$RUNNER_TEMP/tauri-release.json" -- --locked
          bundle=src-tauri/target/release/bundle/nsis
          mkdir -p release-assets
          cp "$bundle"/*-setup.exe "release-assets/mob_${RELEASE_VERSION}_windows_x64-setup.exe"
          cp "$bundle"/*-setup.exe.sig "release-assets/mob_${RELEASE_VERSION}_windows_x64-setup.exe.sig"
      - uses: actions/upload-artifact@v7
        with:
          name: app-release-windows
          path: release-assets/*
          if-no-files-found: error
  linux:
    needs: prepare
    if: vars.RELEASE_LINUX == 'true'
    # The oldest supported Ubuntu, so the AppImage runs on 22.04 and later.
    runs-on: ubuntu-22.04
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - name: Install frontend dependencies and test
        run: npm ci && npm test
      - name: Build AppImage and deb
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY || secrets.TAURI_UPDATER_PUBLIC_KEY }}
          DOWNLOAD_BASE_URL: ${{ vars.DOWNLOAD_BASE_URL || secrets.DOWNLOAD_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          node .github/release/release.mjs config "$RUNNER_TEMP/tauri-release.json"
          npm run tauri build -- --ci --bundles appimage,deb --config "$RUNNER_TEMP/tauri-release.json" -- --locked
          bundle=src-tauri/target/release/bundle
          mkdir -p release-assets
          cp "$bundle"/appimage/*.AppImage "release-assets/mob_${RELEASE_VERSION}_linux_x64.AppImage"
          cp "$bundle"/appimage/*.AppImage.sig "release-assets/mob_${RELEASE_VERSION}_linux_x64.AppImage.sig"
          cp "$bundle"/deb/*.deb "release-assets/mob_${RELEASE_VERSION}_linux_x64.deb"
      - uses: actions/upload-artifact@v7
        with:
          name: app-release-linux
          path: release-assets/*
          if-no-files-found: error
  release:
    needs: [prepare, app, windows, linux]
    # Skipped windows/linux jobs must not skip the release.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: app-release*
          merge-multiple: true
          path: release-assets
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum ./* > SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "mob $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" ./* --clobber
