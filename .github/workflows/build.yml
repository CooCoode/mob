name: Test builds
# Unsigned app builds from any branch, to try a change before it is released. Started by hand
# (Actions → Test builds → Run workflow); signed releases come from release.yml.
# macOS blocks an unsigned app the first time: right-click Mob.app → Open, or run
# xattr -dr com.apple.quarantine Mob.app. Windows SmartScreen warns the same way.
on:
  workflow_dispatch:
    inputs:
      macos:
        description: macOS arm64 (app and DMG)
        type: boolean
        default: true
      windows:
        description: Windows x64 (installer)
        type: boolean
        default: true
      linux:
        description: Linux x64 (AppImage and .deb)
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  # The ticked platforms; unticked ones get no job at all.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          MACOS: ${{ inputs.macos }}
          WINDOWS: ${{ inputs.windows }}
          LINUX: ${{ inputs.linux }}
        run: |
          set -euo pipefail
          all='[
            {"platform":"macos","os":"macos-15","args":"--target aarch64-apple-darwin --bundles app,dmg","bundle":"src-tauri/target/aarch64-apple-darwin/release/bundle","artifact":"mob-test-macos-arm64"},
            {"platform":"windows","os":"windows-2022","args":"--bundles nsis","bundle":"src-tauri/target/release/bundle","artifact":"mob-test-windows-x64"},
            {"platform":"linux","os":"ubuntu-22.04","args":"--bundles appimage,deb","bundle":"src-tauri/target/release/bundle","artifact":"mob-test-linux-x64"}
          ]'
          chosen=$(jq -c --arg m "$MACOS" --arg w "$WINDOWS" --arg l "$LINUX" \
            'map(select((.platform=="macos" and $m=="true") or (.platform=="windows" and $w=="true") or (.platform=="linux" and $l=="true")))' <<<"$all")
          [ "$chosen" != "[]" ] || { echo "::error::Tick at least one platform"; exit 1; }
          echo "matrix={\"include\":$chosen}" >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - name: Install Rust target
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin
      - name: Build
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          ARGS: ${{ matrix.args }}
        run: npm ci && npm run tauri build -- --ci $ARGS -- --locked
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.bundle }}/dmg/*.dmg
            ${{ matrix.bundle }}/nsis/*.exe
            ${{ matrix.bundle }}/appimage/*.AppImage
            ${{ matrix.bundle }}/deb/*.deb
          if-no-files-found: error
          retention-days: 14
